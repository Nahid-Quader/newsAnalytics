# Phase 1 primary sources: verified fresh and carrying full article text in the feed.
# Evidence and selection criteria: research/SOURCES.md (checked 2026-10-23).
# Add a source here only after it has been verified the same way.
#
# Fields: id (stable slug), name, homepage, language (bn|en), connector (rss), feed_url,
# poll_minutes, active, full_text_in_feed, section_from_url, notes, terms_notes,
# backfill (daily_sitemap with {date} placeholder, optional news_sitemap) for collecting past days.

sources:
  - id: prothomalo-bn
    name: Prothom Alo
    homepage: https://www.prothomalo.com
    language: bn
    connector: rss
    feed_url: https://www.prothomalo.com/feed
    poll_minutes: 30
    full_text_in_feed: true
    section_from_url: true
    notes: Article body is HTML inside the second content entry. Feed holds ~35-45 items.
    backfill:
      daily_sitemap: https://www.prothomalo.com/sitemap/sitemap-daily-{date}.xml
      news_sitemap: https://www.prothomalo.com/news_sitemap.xml

  - id: bdnews24-bn
    name: bdnews24 Bangla
    homepage: https://bangla.bdnews24.com
    language: bn
    connector: rss
    feed_url: https://bangla.bdnews24.com/stories.rss
    poll_minutes: 30
    full_text_in_feed: true
    section_from_url: true
    notes: Feed holds 50 items.
    backfill:
      daily_sitemap: https://bangla.bdnews24.com/sitemap/sitemap-daily-{date}.xml
      news_sitemap: https://bangla.bdnews24.com/news_sitemap.xml
      notes: Daily sitemaps are capped at 100 links; the news sitemap adds recent days.

  - id: bdnews24-en
    name: bdnews24.com
    homepage: https://bdnews24.com
    language: en
    connector: rss
    feed_url: https://bdnews24.com/stories.rss
    poll_minutes: 30
    full_text_in_feed: true
    section_from_url: true
    notes: Feed holds 50 items.
    backfill:
      daily_sitemap: https://bdnews24.com/sitemap/sitemap-daily-{date}.xml
      news_sitemap: https://bdnews24.com/news_sitemap.xml

  - id: prothomalo-en
    name: Prothom Alo English
    homepage: https://en.prothomalo.com
    language: en
    connector: rss
    feed_url: https://en.prothomalo.com/feed
    poll_minutes: 10
    full_text_in_feed: true
    section_from_url: true
    notes: Feed holds only 0-2 items at a time (seen empty on 2026-10-23); polled every 10 minutes.
    backfill:
      daily_sitemap: https://en.prothomalo.com/sitemap/sitemap-daily-{date}.xml
      news_sitemap: https://en.prothomalo.com/news_sitemap.xml
