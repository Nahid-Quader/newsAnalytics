stomer service"},{"@type":"ContactPoint","telephone":"+88-02-8180079","contactType":"customer service"},{"@type":"ContactPoint","telephone":"+88-02-8180080","contactType":"customer service"},{"@type":"ContactPoint","telephone":"+88-02-8180081","contactType":"customer service"}],"potentialAction":{"@type":"SearchAction","target":"https://www.prothomalo.com/search?q={search_term_string}"},"email":"mailto:info@prothomalo.com","telephone":"+88-02-8180078-81","address":{"@type":"PostalAddress","description":"বাংলাদেশসহ বিশ্বের সর্বশেষ সংবাদ শিরোনাম, প্রতিবেদন, বিশ্লেষণ, খেলা, বিনোদন, চাকরি, রাজনীতি ও বাণিজ্যের বাংলা নিউজ পড়তে ভিজিট করুন।","postalCode":"1215"},"id":"https://www.prothomalo.com"},"author":[{"@type":"Person","givenName":"প্রতিনিধি","name":"প্রতিনিধি","url":"https://www.prothomalo.com/author/প্রতিনিধি"}],"keywords":"বরগুনা,আমতলী,বরিশাল বিভাগ,হত্যা,মামলা,অভিযোগ","thumbnailUrl":"https://media.prothomalo.com/prothomalo-bangla/2026-06-09/mrw12ryq/rumorscanne_2.jpg?w=1200&h=675&auto=format%2Ccompress&fit=max","articleBody":"&lt;p&gt;বরগুনার আমতলীতে পারিবারিক কলহের জেরে সুপ্রিয়া হালদার (৩২) নামের এক গৃহবধূকে শ্বাসরোধে হত্যার অভিযোগ উঠেছে তাঁর স্বামীর বিরুদ্ধে। ঘটনার পর সুপ্রিয়ার মরদেহ উপজেলা স্বাস্থ্য কমপ্লেক্সে রেখে স্বামী ও শ্বশুরবাড়ির লোকজন পালিয়ে যান।&lt;/p&gt;&lt;p&gt;এ ঘটনায় সুপ্রিয়ার স্বামী অজয় চন্দ্র হাওলাদারকে প্রধান আসামি করে বাদী হয়ে হত্যা মামলা করেছেন তাঁর মা দেপালী রানী। আজ শুক্রবার দুপুরে অজয়ের বড় বোন রমা রানী হাওলাদারকে গ্রেপ্তার করেছে পুলিশ। আমতলী থানার ভারপ্রাপ্ত কর্মকর্তা (ওসি) ইয়াকুব হোসাইন প্রথম আলোকে এ তথ্য নিশ্চিত করেছেন।&lt;/p&gt;.&lt;p&gt;দেপালী রানী বলেন, তাঁর জামাতা বিবাহবহির্ভূত সম্পর্কে জড়িত ছিলেন। এর প্রতিবাদ করায় তাঁর মেয়েকে পিটিয়ে হত্যা করা হয়েছে।&lt;/p&gt;&lt;p&gt;এর আগে গতকাল বৃহস্পতিবার রাত ১০টার দিকে উপজেলার কুকুয়া ইউনিয়নের হরিমৃত্যুঞ্জয় এলাকায় শ্বশুরবাড়িতে অসুস্থ হয়ে পড়েন সুপ্রিয়া। সেখান থেকে তাঁকে হাসপাতালে নেওয়া হয়।&lt;/p&gt;.&lt;p&gt;পুলিশ ও স্বজনদের সঙ্গে কথা বলে জানা গেছে, ২০১২ সালে আমতলীর গাজীপুর বন্দরের বাসিন্দা বিমল ব্যাপারীর মেয়ে সুপ্রিয়ার সঙ্গে একই ইউনিয়নের হরিমৃত্যুঞ্জয় গ্রামের গোপাল চন্দ্র হাওলাদারের ছেলে অজয় চন্দ্র হাওলাদারের বিয়ে হয়। তাঁদের সংসারে ১১ বছর বয়সী একটি মেয়ে ও ১১ মাস বয়সী একটি ছেলে আছে।&lt;/p&gt;&lt;p&gt;সুপ্রিয়ার স্বজনদের অভিযোগ, বিয়ের পর থেকেই অজয় বিভিন্নভাবে সুপ্রিয়ার ওপর নির্যাতন করতেন। গত পাঁচ বছরে পারিবারিক বিষয় নিয়ে সুপ্রিয়াকে একাধিকবার মারধর করা হয়।&lt;/p&gt;&lt;p&gt;স্বজনদের ভাষ্য, গতকাল রাত আটটার দিকে সুপ্রিয়াকে মারধর করেন অজয়। বিষয়টি মুঠোফোনে সুপ্রিয়া মা দেপালী রানীকে জানান। কিছুক্ষণ পর অজয় শাশুড়িকে ফোন করে জানান, সুপ্রিয়া গলায় ফাঁস দিয়েছেন।&lt;/p&gt;.&lt;p&gt;স্বামী ও স্বজনেরা আমতলী উপজেলা স্বাস্থ্য কমপ্লেক্সে নিয়ে গেলে চিকিৎসক সুপ্রিয়াকে মৃত ঘোষণা করেন। এরপর তাঁরা মরদেহ হাসপাতালে রেখে চলে যান বলে অভিযোগ রয়েছে। খবর পেয়ে পুলিশ মরদেহ উদ্ধার করে থানায় নেয়। পরে রাতেই দেপালী রানী বাদী হয়ে সাতজনের নাম উল্লেখ করে হত্যা মামলা করেন।&lt;/p&gt;&lt;p&gt;আজ সকালে সুপ্রিয়ার মরদেহ ময়নাতদন্তের জন্য বরগুনা জেনারেল হাসপাতালের মর্গে পাঠানো হয়। বিষয়টি নিশ্চিত করে ওসি ইয়াকুব হোসাইন বলেন, অন্য আসামিদের গ্রেপ্তারে অভিযান চলছে। ময়নাতদন্তের প্রতিবেদন পাওয়ার পর মৃত্যুর সুনির্দিষ্ট কারণ জানা যাবে।&lt;/p&gt;","dateCreated":"2026-07-24T16:01:34+06:00","dateModified":"2026-07-24T16:01:34+06:00","name":"গৃহবধূর মরদেহ হাসপাতালে রেখে স্বামীর পালানোর অভিযোগ, হত্যা মামলায় ননদ গ্রেপ্তার","isAccessibleForFree":true,"isPartOf":{"@type":"WebPage","url":"https://www.prothomalo.com/bangladesh/district/34hl2tc2c5","primaryImageOfPage":{"@type":"ImageObject","url":"https://media.prothomalo.com/prothomalo-bangla/2026-06-09/mrw12ryq/rumorscanne_2.jpg?w=1200&h=675&auto=format%2Ccompress&fit=max","width":"1200","height":"675"}},"articleSection":"জেলা","@type":"Article","@context":"http://schema.org"}</script><script type="application/ld+json">{"headline":"গৃহবধূর মরদেহ হাসপাতালে রেখে স্বামীর পালানোর অভিযোগ, হত্যা মামলায় ননদ গ্রেপ্তার","image":{"@type":"ImageObject","url":"https://media.prothomalo.com/prothomalo-bangla/2026-06-09/mrw12ryq/rumorscanne_2.jpg?w=1200&h=675&auto=format%2Ccompress&fit=max",
