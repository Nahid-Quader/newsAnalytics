[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsanalytics-backend"
version = "0.1.0"
description = "Bangladesh News Intelligence Platform: ingestion pipeline and API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "apscheduler>=3.10,<4",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits real publisher endpoints (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"
